<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{plantilla :: cabeza}"></head>
    <body class="d-flex flex-column min-vh-100">
        <header th:replace="~{plantilla :: encabezado}"></header>

        <main class="container flex-grow-1 pb-4">
            <div class="d-flex justify-content-between align-items-center my-4">
                <h2 class="h4 mb-0">[[#{catalogo.titulo}]]</h2>
                <button type="button" class="btn btn-primary"
                        data-bs-toggle="modal" data-bs-target="#modalSuculenta"
                        data-modo="nueva" th:data-titulo="#{form.titulo.nueva}">
                    [[#{boton.nueva}]]
                </button>
            </div>

            <div th:replace="~{suculenta/componentes :: tarjetas}"></div>
        </main>

        <div th:replace="~{suculenta/componentes :: modalFormulario}"></div>
        <div th:replace="~{suculenta/componentes :: modalEliminar}"></div>
        <div th:replace="~{plantilla :: avisos}"></div>

        <footer th:replace="~{plantilla :: pie}"></footer>
        <script th:src="@{/js/suculenta.js}"></script>
    </body>
</html>
