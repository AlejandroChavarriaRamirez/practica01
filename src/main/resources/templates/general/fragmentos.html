<!-- Fragmento #1 que va en el head de todas las paginas, incluye Bootstrap -->
<head th:fragment="head">
    <title>Suculentas</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/rutinas.js}"></script>
</head>

<!-- Fragmento #2 define el encabezado de las paginas con el menu de navegacion -->
<header th:fragment="header">
    <nav class="navbar navbar-expand-sm navbar-dark bg-success">
        <div class="container">
            <a th:href="@{/}" class="navbar-brand">[[#{aplicacion.titulo}]]</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/}">[[#{plantilla.inicio}]]</a></li>
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/suculenta/listado}">[[#{plantilla.suculentas}]]</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="py-2 bg-light border-bottom">
        <div class="container">
            <h1>[[#{plantilla.subtitulo}]]</h1>
        </div>
    </section>
</header>

<!-- Fragmento #3 define el footer de las paginas -->
<footer th:fragment="footer" class="p-2 mt-5 bg-success text-white">
    <p class="lead text-center">[[#{plantilla.derechos}]] &COPY;</p>
</footer>

<!-- Fragmento #4 define una ventana tipo Toast para mostrar mensajes al usuario -->
<section th:fragment="mostrarToast">
    <div aria-live="polite" aria-atomic="true"
         class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">
        <div th:if="${error}" class="toast show" role="alert">
            <div class="toast-header text-white bg-danger">
                <strong class="me-auto">[[#{error}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${error}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm"
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
        <div th:if="${todoOk}" class="toast show" role="status">
            <div class="toast-header text-white bg-success">
                <strong class="me-auto">[[#{atencion}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${todoOk}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm"
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Fragmento #5 define la ventana modal para confirmar la eliminacion -->
<section th:fragment="confirmarEliminar(accionEliminar, nombreId)">
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="${accionEliminar}" method="post">
                    <input type="hidden" th:attr="name=${nombreId}" id="modalId"/>
                    <div class="modal-header bg-warning">
                        <h5 class="modal-title">[[#{accion.confirmar}]]</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>[[#{accion.confirmar.texto1}]]<span id="modalDescripcion"></span>?</p>
                        <h6>[[#{accion.confirmar.texto2}]]</h6>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-danger">[[#{accion.eliminar}]]</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">[[#{accion.cerrar}]]</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
