<!-- Head con Bootstrap -->
<head th:fragment="cabeza">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>[[#{app.nombre}]]</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>

<!-- Menu y titulo -->
<header th:fragment="encabezado">
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" th:href="@{/}">[[#{app.nombre}]]</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/suculenta/listado}">[[#{menu.catalogo}]]</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="border-bottom py-3">
        <div class="container">
            <h1 class="h3 mb-1">[[#{encabezado.titulo}]]</h1>
            <p class="text-muted mb-0">[[#{encabezado.descripcion}]]</p>
        </div>
    </div>
</header>

<!-- Mensajes despues de guardar o eliminar -->
<div th:fragment="avisos" class="mt-3">
    <div th:if="${avisoExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        [[#{${avisoExito}}]]
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${avisoError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        [[#{${avisoError}}]]
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Pie de pagina -->
<footer th:fragment="pie" class="bg-primary text-white text-center py-3 mt-auto">
    <small>[[#{pie.texto}]]</small>
</footer>
