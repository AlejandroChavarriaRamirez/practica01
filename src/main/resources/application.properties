spring.application.name=practica01
server.port=91

#Se define el formato de fecha/hora del log: dia del mes, hora y minuto
logging.pattern.dateformat=dd HH:mm

#Se definen los mensajes de consola a nivel TRACE
logging.level.root=TRACE

#Se define no presentar el banner de SPRING en el log del servidor
spring.main.banner-mode=off

#Se evita el uso de cache en desarrollo
spring.thymeleaf.cache=false

#Conexion local a la BD practica en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/practica

#Usuario y clave de practica.sql
spring.datasource.username=usuario_practica
spring.datasource.password=la_Clave

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Mostrar informacion del SQL en el log
spring.jpa.properties.hibernate.format_sql=true