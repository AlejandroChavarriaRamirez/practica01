spring.application.name=practica01

# La aplicacion se abre en http://localhost:91
server.port=91

# Consola en nivel TRACE; cada linea inicia con dia del mes, hora y minuto (ej: 19 16:45)
logging.level.root=TRACE
logging.pattern.dateformat=dd HH:mm

# Sin el banner de Spring al arrancar
spring.main.banner-mode=off

# Thymeleaf sin cache para ver los cambios del HTML sin reiniciar
spring.thymeleaf.cache=false

# Base de datos practica en el MySQL local, con el usuario creado en sql/practica.sql
spring.datasource.url=jdbc:mysql://localhost:3306/practica
spring.datasource.username=usuario_practica
spring.datasource.password=la_Clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate trabaja con el dialecto de MySQL y muestra ordenadas las consultas en el log
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
