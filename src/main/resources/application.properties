spring.application.name=practica01

# Puerto
server.port=91

# Log en TRACE con dia, hora y minuto
logging.level.root=TRACE
logging.pattern.dateformat=dd HH:mm

spring.main.banner-mode=off

spring.thymeleaf.cache=false

# Conexion a la BD practica
spring.datasource.url=jdbc:mysql://localhost:3306/practica
spring.datasource.username=usuario_practica
spring.datasource.password=la_Clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
